{% extends 'base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-md-6 mx-auto">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h3 class="mb-0"><i class="fas fa-sign-in-alt"></i> Вход в аккаунт</h3>
                </div>
                <div class="card-body">
                    {% if form.errors %}
                        <div class="alert alert-danger">
                            <i class="fas fa-exclamation-triangle"></i> Неверное имя пользователя или пароль.
                        </div>
                    {% endif %}
                    
                    <form method="post" action="{% url 'login' %}">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="id_username" class="form-label">
                                <i class="fas fa-user"></i> Имя пользователя
                            </label>
                            <input type="text" name="username" id="id_username" class="form-control" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="id_password" class="form-label">
                                <i class="fas fa-lock"></i> Пароль
                            </label>
                            <input type="password" name="password" id="id_password" class="form-control" required>
                        </div>
                        
                        <input type="hidden" name="next" value="{{ next }}">
                        
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-sign-in-alt"></i> Войти
                        </button>
                    </form>
                    
                    <hr>
                    
                    <div class="text-center">
                        <p>Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
                        <a href="{% url 'main' %}" class="btn btn-outline-secondary btn-sm">
                            <i class="fas fa-arrow-left"></i> На главную
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
